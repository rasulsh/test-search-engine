name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  php:
    name: PHP (lint + PSR-12 + PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Lint PHP sources
        run: |
          files=$(find server -name '*.php' -type f)
          if [ -n "$files" ]; then
            echo "$files" | xargs -n1 -P4 php -l
          else
            echo "No PHP files to lint."
          fi

      - name: Install dev dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Coding standard (PSR-12)
        run: vendor/bin/phpcs

      - name: PHPUnit
        run: vendor/bin/phpunit

  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements-dev.txt

      - name: Ruff
        run: ruff check pipeline

      - name: Pytest
        run: pytest
