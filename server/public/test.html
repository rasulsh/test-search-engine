<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>آزمایش جستجو</title>
<!--
  Search test page. Fully self-contained and same-origin: every URL below is
  RELATIVE to this page, so it works under any subdirectory, and nothing is loaded
  from a CDN. No model runs in the browser (M18): the page sends only the query
  text; cPanel asks the VPS for semantic neighbours and returns each result's
  cosine score. See README, "Search test page".
-->
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f1f3f4;
    --text: #202124;
    --muted: #5f6368;
    --border: #dfe1e5;
    --accent: #1a73e8;
    --accent-soft: #e8f0fe;
    --warn-bg: #fef7e0;
    --warn-text: #7a5a00;
    --error-bg: #fce8e6;
    --error-text: #a50e0e;
    --shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
    --card-shadow: 0 1px 3px rgba(60, 64, 67, 0.15), 0 1px 2px rgba(60, 64, 67, 0.1);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202124;
      --surface: #303134;
      --surface-2: #3c4043;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --border: #5f6368;
      --accent: #8ab4f8;
      --accent-soft: #394457;
      --warn-bg: #413816;
      --warn-text: #fdd663;
      --error-bg: #3c1e1e;
      --error-text: #f28b82;
      --shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
      --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Vazirmatn, Tahoma, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }

  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 22vh;
    transition: padding-top 0.25s ease;
  }

  body.has-results header { padding-top: 24px; }

  h1 {
    margin: 0 0 24px;
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--accent);
  }

  body.has-results h1 { font-size: 24px; margin-bottom: 14px; }

  h1 span { color: var(--text); font-weight: 300; }

  form {
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 640px;
    height: 48px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 0 6px 0 16px;
  }

  form:hover, form:focus-within { box-shadow: var(--shadow); border-color: transparent; }

  input[type="search"] {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 16px;
    padding: 0 12px;
  }

  button {
    font: inherit;
    cursor: pointer;
  }

  .search-button {
    height: 36px;
    padding: 0 18px;
    border: 0;
    border-radius: 18px;
    background: var(--accent);
    color: var(--bg);
    font-weight: 600;
  }

  .search-button:disabled { opacity: 0.6; cursor: progress; }

  .notice {
    max-width: 640px;
    margin: 16px auto 0;
    padding: 10px 14px;
    border-radius: 8px;
    background: var(--warn-bg);
    color: var(--warn-text);
    font-size: 14px;
  }

  .notice.error { background: var(--error-bg); color: var(--error-text); }

  .summary {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin: 24px 0 6px;
    color: var(--muted);
    font-size: 14px;
  }

  .badge {
    padding: 0 8px;
    border-radius: 10px;
    background: var(--surface-2);
    font-size: 12px;
    line-height: 20px;
  }

  .badge.hybrid { background: var(--accent-soft); color: var(--accent); }

  .did-you-mean { margin: 6px 0 0; font-size: 16px; }

  .did-you-mean button {
    padding: 0;
    border: 0;
    background: none;
    color: var(--accent);
    font-weight: 700;
    font-style: italic;
    text-decoration: underline;
  }

  /* Class display rules must not defeat the hidden attribute. */
  [hidden] { display: none !important; }

  .results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin: 18px 0 0;
    padding: 0;
    list-style: none;
  }

  .card {
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    border-radius: 12px;
    background: var(--surface);
    box-shadow: var(--card-shadow);
    color: inherit;
    text-decoration: none;
    transition: box-shadow 0.15s, transform 0.15s;
  }

  .card:hover, .card:focus-visible { box-shadow: var(--shadow); transform: translateY(-2px); outline: none; }

  .thumb {
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border-bottom: 1px solid var(--surface-2);
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 12px;
  }

  .thumb.empty::after {
    content: '';
    width: 40%;
    height: 40%;
    border-radius: 8px;
    background: var(--surface-2);
  }

  .card-body {
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 8px;
    padding: 12px 14px 14px;
  }

  .title {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 0;
    font-size: 14px;
    font-weight: 500;
  }

  .price {
    margin-top: auto;
    font-weight: 700;
    color: var(--text);
  }

  .meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
  }

  /* Cosine similarity to the query: a tuning aid, deliberately quiet. */
  .cosine { font-size: 11px; opacity: 0.8; font-variant-numeric: tabular-nums; }

  .empty-state {
    margin: 48px auto;
    max-width: 420px;
    text-align: center;
    color: var(--muted);
  }

  .empty-state h2 {
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
  }

  .empty-state p { margin: 0; font-size: 14px; }

  footer {
    margin-top: 40px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }

  @media (max-width: 480px) {
    header { padding-top: 14vh; }
    h1 { font-size: 30px; }
    .results { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card-body { padding: 10px; }
    .search-button { padding: 0 14px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>جستجو <span>آزمایشی</span></h1>

    <form id="search-form" role="search">
      <input id="q" type="search" name="q" autocomplete="off" maxlength="200"
             placeholder="نام محصول، برند یا مدل را بنویسید…" aria-label="عبارت جستجو">
      <button id="submit" class="search-button" type="submit">جستجو</button>
    </form>
  </header>

  <div id="notice" class="notice" role="status" hidden></div>

  <section id="output" aria-live="polite">
    <div id="summary" class="summary" hidden></div>
    <p id="did-you-mean" class="did-you-mean" hidden></p>
    <ol id="results" class="results"></ol>
    <div id="empty" class="empty-state" hidden></div>
  </section>

  <footer>صفحهٔ آزمایشی سرویس جستجو · همهٔ فایل‌ها از همین دامنه بارگذاری می‌شوند</footer>
</main>

<script type="module">
  // ---- Configuration (all paths are relative to this page) --------------------
  const SEARCH_URL = './search.php';
  // The service is deployed in a subdirectory of the store (e.g. /search-api/),
  // so relative product URLs and OpenCart image paths resolve from the parent.
  // Set store_base / image_base in config.php (install.php asks for them) and
  // the server returns absolute links, which these bases leave untouched.
  const STORE_BASE = new URL('../', location.href);
  const IMAGE_BASE = new URL('image/', STORE_BASE);
  const LIMIT = 24;
  const MAX_QUERY_CHARS = 200;
  const PRICE_SUFFIX = '';

  // UI strings (Persian by request); code, identifiers and console output stay English.
  const TEXT = {
    serviceError: 'ارتباط با سرویس جستجو برقرار نشد. کمی بعد دوباره امتحان کنید.',
    results: (n) => `${fmt(n)} نتیجه`,
    roundTrip: (ms) => `زمان پاسخ: ${fmt(ms)} میلی‌ثانیه`,
    modeHybrid: 'ترکیبی (کلیدواژه + معنایی)',
    modeKeyword: 'فقط کلیدواژه',
    didYouMean: 'منظورتان این بود: ',
    showingResultsFor: 'نتایج برای: ',
    noResults: (q) => `برای «${q}» نتیجه‌ای پیدا نشد`,
    noResultsHint: 'املای عبارت را بررسی کنید یا از کلمه‌های کلی‌تر استفاده کنید.',
    cosine: (score) => `شباهت ${scoreFormat.format(score)}`,
    cosineTitle: 'شباهت کسینوسی به عبارت جستجو',
    noTitle: 'بدون عنوان',
  };

  const numberFormat = new Intl.NumberFormat('fa-IR');
  const scoreFormat = new Intl.NumberFormat('fa-IR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  function fmt(n) {
    return numberFormat.format(n);
  }

  const $ = (id) => document.getElementById(id);
  const form = $('search-form');
  const input = $('q');
  const submitButton = $('submit');

  // ---- Search ------------------------------------------------------------------
  let searchSeq = 0;

  async function runSearch(rawQuery) {
    const q = rawQuery.trim().slice(0, MAX_QUERY_CHARS);
    if (!q) {
      return;
    }
    const seq = ++searchSeq;
    submitButton.disabled = true;
    showNotice(null);

    // Only the query: the server adds the semantic tier (via the VPS) when it can.
    const body = { q, limit: LIMIT, with_details: true };
    const start = performance.now();
    let data = null;
    try {
      const res = await fetch(SEARCH_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        throw new Error(`search service returned HTTP ${res.status}`);
      }
      data = await res.json();
    } catch (err) {
      console.warn('search-test: search request failed', err);
    }
    const roundTripMs = Math.round(performance.now() - start);

    if (seq !== searchSeq) {
      return; // a newer search superseded this one
    }
    submitButton.disabled = false;
    if (!data) {
      showNotice(TEXT.serviceError, true);
      return;
    }
    render(q, data, { roundTripMs });
    const url = new URL(location.href);
    url.searchParams.set('q', q);
    history.replaceState(null, '', url);
  }

  // ---- Rendering ----------------------------------------------------------------
  function showNotice(text, isError = false) {
    const el = $('notice');
    el.hidden = !text;
    el.textContent = text ?? '';
    el.classList.toggle('error', isError);
  }

  // Only http(s) links; a relative value resolves against the store.
  function safeUrl(value, base) {
    if (typeof value !== 'string' || value === '') {
      return null;
    }
    try {
      const url = new URL(value, base);
      return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : null;
    } catch {
      return null;
    }
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) {
      node.className = className;
    }
    if (text !== undefined) {
      node.textContent = text;
    }
    return node;
  }

  function card(product, cosine) {
    const href = safeUrl(product.url, STORE_BASE);
    const link = el(href ? 'a' : 'div', 'card');
    if (href) {
      link.href = href;
      link.target = '_blank';
      link.rel = 'noopener';
    }

    const thumb = el('div', 'thumb');
    const src = safeUrl(product.image, IMAGE_BASE);
    if (src) {
      const img = el('img');
      img.src = src;
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      img.addEventListener('error', () => {
        img.remove();
        thumb.classList.add('empty');
      });
      thumb.append(img);
    } else {
      thumb.classList.add('empty');
    }

    const bodyEl = el('div', 'card-body');
    bodyEl.append(el('h3', 'title', product.title || TEXT.noTitle));
    if (typeof product.price === 'number' && product.price > 0) {
      bodyEl.append(el('div', 'price', `${fmt(product.price)}${PRICE_SUFFIX ? ` ${PRICE_SUFFIX}` : ''}`));
    }
    const meta = el('div', 'meta');
    meta.append(el('span', null, `#${product.id}`));
    if (typeof cosine === 'number') {
      const score = el('span', 'cosine', TEXT.cosine(cosine));
      score.title = TEXT.cosineTitle;
      meta.append(score);
    }
    bodyEl.append(meta);

    link.append(thumb, bodyEl);
    const item = el('li');
    item.append(link);
    return item;
  }

  function render(q, data, { roundTripMs }) {
    document.body.classList.add('has-results');
    // cosine_scores is present only when the VPS answered (hybrid results).
    const hybrid = Array.isArray(data.cosine_scores);

    const summary = $('summary');
    summary.replaceChildren(
      el('span', null, TEXT.results(data.count ?? 0)),
      el('span', null, TEXT.roundTrip(roundTripMs)),
      el('span', `badge${hybrid ? ' hybrid' : ''}`, hybrid ? TEXT.modeHybrid : TEXT.modeKeyword),
    );
    summary.hidden = false;

    const suggestion = $('did-you-mean');
    suggestion.replaceChildren();
    suggestion.hidden = !data.did_you_mean;
    if (data.did_you_mean) {
      const button = el('button', null, data.did_you_mean);
      button.type = 'button';
      button.addEventListener('click', () => {
        input.value = data.did_you_mean;
        runSearch(data.did_you_mean);
      });
      // Applied: the results below are for the suggestion. Otherwise the
      // literal query had a few hits and the suggestion is only offered.
      suggestion.append(data.did_you_mean_applied ? TEXT.showingResultsFor : TEXT.didYouMean, button);
    }

    const ids = data.product_ids ?? [];
    const cosineById = new Map();
    if (Array.isArray(data.cosine_scores)) {
      ids.forEach((id, i) => cosineById.set(id, data.cosine_scores[i]));
    }
    const products = Array.isArray(data.products) ? data.products : ids.map((id) => ({ id }));
    const results = $('results');
    results.replaceChildren(...products.map((product) => card(product, cosineById.get(product.id))));
    results.hidden = products.length === 0;

    const empty = $('empty');
    empty.hidden = products.length > 0;
    empty.replaceChildren(
      ...(products.length > 0 ? [] : [el('h2', null, TEXT.noResults(q)), el('p', null, TEXT.noResultsHint)]),
    );
  }

  // ---- Wiring --------------------------------------------------------------------
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    runSearch(input.value);
  });

  const initial = new URL(location.href).searchParams.get('q');
  if (initial) {
    input.value = initial;
    runSearch(initial);
  } else {
    input.focus();
  }
</script>
</body>
</html>
