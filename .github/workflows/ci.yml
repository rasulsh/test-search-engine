name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  php:
    name: PHP (lint + PSR-12 + PHPUnit)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: search_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      SEARCH_TEST_DB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=search_test;charset=utf8mb4"
      SEARCH_TEST_DB_USER: root
      SEARCH_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, apcu
          # Exercise the APCu cache paths (off by default in the CLI SAPI).
          ini-values: apc.enable_cli=1
          coverage: none
          tools: composer:v2

      - name: Lint PHP sources
        run: |
          files=$(find server -name '*.php' -type f)
          if [ -n "$files" ]; then
            echo "$files" | xargs -n1 -P4 php -l
          else
            echo "No PHP files to lint."
          fi

      - name: Install dev dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Coding standard (PSR-12)
        run: vendor/bin/phpcs

      - name: PHPUnit
        run: vendor/bin/phpunit

  python:
    name: Python (ruff + pytest; pipeline + VPS service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements-dev.txt -r vps/requirements-dev.txt

      - name: Ruff
        run: ruff check pipeline vps

      - name: Shell syntax
        run: bash -n vps/setup.sh

      - name: Pytest
        run: pytest
